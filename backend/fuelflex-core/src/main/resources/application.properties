spring.application.name=FuelFlex Platform

server.port=8080
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

spring.datasource.url=jdbc:postgresql://localhost:5432/fuelflex
spring.datasource.username=fuelflex_user
spring.datasource.password=fuelflex123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================================================
# DATABASE MIGRATIONS
# ==================================================

# The existing public schema predates Flyway. On its first controlled startup,
# Flyway records it as baseline version 1 without recreating business objects.
# All subsequent schema changes must use versioned migrations starting at V2.
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.default-schema=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=FuelFlex existing schema baseline

management.endpoints.web.exposure.include=health,info
spring.jpa.open-in-view=false

# ==================================================
# EMAIL / SMTP
# ==================================================

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}

spring.mail.default-encoding=UTF-8

# ==================================================
# JWT
# ==================================================

security.jwt.secret=${JWT_SECRET:FuelFlexPlatformLocalDevelopmentSecretKey2026Minimum32Characters}
security.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}

# ==================================================
# FILE UPLOADS
# ==================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

fuelflex.storage.organization-logos-directory=uploads/organizations
fuelflex.storage.organization-logos-url-prefix=/uploads/organizations
